<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>许愿柳 · 复古魔法杂货铺</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Fredoka+One&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ---------- 全局重置 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1410;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Quicksand', sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        /* ---------- 背景：暖调暗光影 + 木纹桌面 ---------- */
        .scene {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at 50% 60%, #4a3520 0%, #1a1410 60%, #0d0a08 100%);
        }

        /* 木纹桌面（下半部分） */
        .table {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45%;
            background: linear-gradient(180deg, #3d2b1a 0%, #2a1c10 30%, #1f140c 100%);
            box-shadow: 0 -20px 80px rgba(0, 0, 0, 0.8);
        }
        /* 木纹纹理（纯CSS模拟） */
        .table::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(90deg,
                    transparent 0px, transparent 2px,
                    rgba(80, 50, 30, 0.15) 2px, rgba(80, 50, 30, 0.15) 3px,
                    transparent 3px, transparent 8px,
                    rgba(60, 40, 25, 0.08) 8px, rgba(60, 40, 25, 0.08) 9px
                ),
                repeating-linear-gradient(0deg,
                    transparent 0px, transparent 30px,
                    rgba(100, 70, 40, 0.05) 30px, rgba(100, 70, 40, 0.05) 31px
                );
            pointer-events: none;
        }
        /* 桌面磨损做旧光效 */
        .table::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 0%, rgba(180, 140, 100, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        /* 聚光灯效果（暖黄） */
        .spotlight {
            position: absolute;
            top: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 80%;
            background: radial-gradient(ellipse at 50% 30%, rgba(255, 200, 120, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }

        /* ---------- 主容器（卡片浮在场景上） ---------- */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 880px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px 40px;
            /* 微弱的玻璃质感，但保留暗调 */
            background: rgba(20, 15, 10, 0.3);
            border-radius: 40px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(200, 160, 100, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
        }

        /* ---------- 顶部标题：许愿柳（米白色复古衬线） ---------- */
        .main-title {
            font-family: 'Playfair Display', 'Times New Roman', serif;
            font-weight: 900;
            font-size: 4.2rem;
            color: #f5ede4;
            text-shadow:
                0 0 30px rgba(200, 160, 100, 0.15),
                0 4px 20px rgba(0, 0, 0, 0.6),
                0 2px 4px rgba(0, 0, 0, 0.8);
            letter-spacing: 12px;
            margin-bottom: 6px;
            text-align: center;
            line-height: 1.1;
        }
        .main-title small {
            font-size: 1.2rem;
            letter-spacing: 6px;
            opacity: 0.6;
            display: block;
            font-weight: 400;
        }

        /* ---------- SVG 展示区（柳树 + 包装盒） ---------- */
        .display-area {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin: 8px 0 10px;
            position: relative;
            min-height: 340px;
        }

        #willow-svg {
            width: 400px;
            height: 380px;
            filter: drop-shadow(0 10px 40px rgba(0, 0, 0, 0.7));
            transition: transform 0.1s;
        }
        .sway {
            animation: swayAnim 6s ease-in-out infinite alternate;
        }
        @keyframes swayAnim {
            0% { transform: rotate(-0.8deg) translateY(0); }
            100% { transform: rotate(0.8deg) translateY(-3px); }
        }

        /* 折断震动 */
        .shake {
            animation: shakeAnim 0.25s ease-in-out 3;
        }
        @keyframes shakeAnim {
            0%, 100% { transform: rotate(0deg) translateX(0); }
            25% { transform: rotate(2deg) translateX(-6px); }
            75% { transform: rotate(-2deg) translateX(6px); }
        }

        /* ---------- 交互区 ---------- */
        .interact-area {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin: 8px 0 18px;
            padding: 0 10px;
        }

        .input-wrapper {
            position: relative;
        }
        #wish-input {
            width: 100%;
            padding: 16px 22px;
            background: rgba(30, 22, 16, 0.85);
            border: 1px solid #5a4030;
            border-radius: 30px;
            color: #e8ddd0;
            font-family: 'Quicksand', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
        }
        #wish-input::placeholder {
            color: #6a5a4a;
            font-style: italic;
            font-weight: 300;
        }
        #wish-input:focus {
            border-color: #c9a87a;
            box-shadow: 0 0 40px rgba(200, 160, 100, 0.12);
            background: rgba(40, 30, 20, 0.9);
        }

        .btn-row {
            display: flex;
            gap: 14px;
            align-items: center;
        }
        #submit-btn {
            flex: 1;
            padding: 14px 20px;
            background: linear-gradient(145deg, #5a3a28, #3a2518);
            border: 1px solid #8a6a4a;
            color: #f0e8d8;
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 40px;
            transition: all 0.3s ease;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        #submit-btn:hover:not(:disabled) {
            background: linear-gradient(145deg, #7a4a30, #4a2a1a);
            border-color: #c9a87a;
            box-shadow: 0 0 40px rgba(200, 160, 100, 0.15), 0 4px 20px rgba(0, 0, 0, 0.4);
            transform: scale(1.02);
        }
        #submit-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.6);
        }

        .loading-text {
            font-size: 0.85rem;
            color: #b09878;
            letter-spacing: 3px;
            min-height: 28px;
            text-align: center;
            font-family: 'Quicksand', sans-serif;
            font-weight: 400;
        }
        .loading-text.active {
            animation: pulseTxt 1.2s ease-in-out infinite;
        }
        @keyframes pulseTxt {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* ---------- 代价契约展示区 ---------- */
        .contract-area {
            width: 100%;
            max-width: 780px;
            margin-top: 16px;
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            padding: 22px 28px;
            background: rgba(25, 18, 12, 0.85);
            border: 1px solid #6a5038;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        }
        .contract-area.show {
            display: grid;
        }

        .contract-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .contract-col .label {
            font-size: 0.6rem;
            letter-spacing: 4px;
            color: #b09878;
            border-bottom: 1px solid #3a2a1a;
            padding-bottom: 6px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .contract-col .content {
            font-size: 0.9rem;
            line-height: 1.7;
            color: #e8ddd0;
            min-height: 60px;
            font-weight: 300;
        }
        .contract-col .content.wish-text {
            color: #d4c8b8;
        }
        .contract-col .content.price-text {
            color: #f0ddd0;
        }

        .contract-footer {
            grid-column: 1 / -1;
            text-align: right;
            font-size: 0.55rem;
            color: #5a4a3a;
            letter-spacing: 2px;
            border-top: 1px solid #2a1a10;
            padding-top: 10px;
            margin-top: 4px;
            font-style: italic;
        }

        /* ---------- 响应式 ---------- */
        @media (max-width: 700px) {
            .main-title {
                font-size: 2.8rem;
                letter-spacing: 6px;
            }
            .main-title small {
                font-size: 0.9rem;
            }
            #willow-svg {
                width: 300px;
                height: 300px;
            }
            .contract-area {
                grid-template-columns: 1fr;
                padding: 18px 16px;
                gap: 12px;
            }
            .btn-row {
                flex-direction: column;
            }
            #submit-btn {
                width: 100%;
            }
        }
        @media (max-width: 450px) {
            .main-title {
                font-size: 2.0rem;
                letter-spacing: 4px;
            }
            #willow-svg {
                width: 240px;
                height: 250px;
            }
            .container {
                padding: 12px 10px 30px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 场景背景 ===== -->
    <div class="scene">
        <div class="table"></div>
        <div class="spotlight"></div>
    </div>

    <!-- ===== 主容器 ===== -->
    <div class="container">

        <!-- 顶部标题 -->
        <div class="main-title">
            许愿柳

        <!-- ===== 展示区：柳树 + 包装盒 (SVG) ===== -->
        <div class="display-area">
            <svg id="willow-svg" class="sway" viewBox="0 0 500 460" xmlns="http://www.w3.org/2000/svg">
                <defs>

                    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#1a0e08"/>
                        <stop offset="30%" stop-color="#2a1a10"/>
                        <stop offset="60%" stop-color="#1f120a"/>
                        <stop offset="100%" stop-color="#140a06"/>
                    </linearGradient>
                    <linearGradient id="woodGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#2a1a10"/>

                    <!-- 包装盒米白底色 -->
                    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#f5ede4"/>
                        <stop offset="100%" stop-color="#e0d5c8"/>
                    </linearGradient>
                    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="100%">

                        <stop offset="100%" stop-color="rgba(255,200,120,0)"/>
                    </radialGradient>
                </defs>

                <!-- 桌面聚光晕（在SVG底部） -->
                <ellipse cx="250" cy="420" rx="200" ry="30" fill="url(#glowSpot)" opacity="0.4"/>

                <!-- ========== 三棱柱包装盒 ========== -->
                <!-- 左侧面（三角形侧面） -->
                <polygon points="150,240 200,180 200,320 150,380" fill="url(#boxSide)" stroke="#a09080" stroke-width="0.5"/>
                <!-- 左侧面文字：ONE WISH WILLOW（竖排） -->

                <!-- 正面：上下弧形装饰条 -->

                <path d="M160,370 Q250,358 340,350" stroke="#a93226" stroke-width="3" fill="none" opacity="0.6"/>

                <!-- 左上角星星 -->

                    <textPath href="#arcPath" startOffset="50%" text-anchor="middle">ONE WISH WILLOW</textPath>

                <!-- 断裂线条 + CRACK -->
                <line x1="195" y1="290" x2="245" y2="285" stroke="#a93226" stroke-width="2.5" stroke-dasharray="6,4"/>
                <text x="198" y="305" font-family="'Fredoka One', cursive" font-size="14" fill="#a93226" font-weight="700">CRACK</text>

                <!-- 两个复古卡通头像（简化为风格化圆形人脸） -->

                <circle cx="230" cy="310" r="18" fill="none" stroke="#a93226" stroke-width="2"/>
                <circle cx="230" cy="310" r="14" fill="none" stroke="#a93226" stroke-width="1.5"/>
                <circle cx="225" cy="306" r="2.5" fill="#a93226"/> <!-- 眼睛 -->
                <circle cx="235" cy="306" r="2.5" fill="#a93226"/> <!-- 眼睛 -->
                <path d="M225,316 Q230,321 235,316" stroke="#a93226" stroke-width="1.5" fill="none"/> <!-- 微笑 -->
                <!-- 男孩头发 -->
                <path d="M218,302 Q225,294 235,296 Q240,294 242,302" stroke="#a93226" stroke-width="1.5" fill="none"/>

                <!-- 女孩（右） -->
                <circle cx="280" cy="310" r="18" fill="none" stroke="#a93226" stroke-width="2"/>
                <circle cx="280" cy="310" r="14" fill="none" stroke="#a93226" stroke-width="1.5"/>
                <circle cx="275" cy="306" r="2.5" fill="#a93226"/> <!-- 眼睛 -->
                <circle cx="285" cy="306" r="2.5" fill="#a93226"/> <!-- 眼睛 -->
                <path d="M274,317 Q280,323 286,317" stroke="#a93226" stroke-width="1.5" fill="none"/> <!-- 微笑 -->
                <!-- 女孩头发（卷发） -->
                <circle cx="272" cy="296" r="6" fill="none" stroke="#a93226" stroke-width="1.5"/>
                <circle cx="280" cy="294" r="6" fill="none" stroke="#a93226" stroke-width="1.5"/>
                <circle cx="288" cy="296" r="6" fill="none" stroke="#a93226" stroke-width="1.5"/>

                <!-- 周围星星装饰 -->
                <text x="210" y="275" font-size="10" fill="#a93226">✦</text>
                <text x="265" y="278" font-size="8" fill="#a93226">✦</text>
                <text x="300" y="290" font-size="10" fill="#a93226">✦</text>
                <text x="245" y="330" font-size="7" fill="#a93226">✦</text>
                <text x="205" y="340" font-size="8" fill="#a93226">✦</text>
                <text x="310" y="330" font-size="9" fill="#a93226">✦</text>

                <!-- 右上角：AMAZE YOUR FRIENDS! -->
                <rect x="295" y="238" width="48" height="20" rx="4" fill="#a93226" opacity="0.9"/>
                <text x="319" y="253" font-family="'Fredoka One', cursive" font-size="8" fill="white" font-weight="700" text-anchor="middle">AMAZE YOUR</text>
                <text x="319" y="262" font-family="'Fredoka One', cursive" font-size="6" fill="white" font-weight="700" text-anchor="middle">FRIENDS!</text>

                <!-- 右下角：You only get ONE WISH -->
                <rect x="225" y="350" width="45" height="18" rx="3" fill="#a93226" transform="rotate(-8, 248, 359)"/>
                <text x="248" y="363" font-family="'Fredoka One', cursive" font-size="6.5" fill="white" font-weight="700" text-anchor="middle" transform="rotate(-8, 248, 359)">You only get</text>
                <text x="248" y="371" font-family="'Fredoka One', cursive" font-size="6.5" fill="white" font-weight="700" text-anchor="middle" transform="rotate(-8, 248, 359)">ONE WISH</text>

                      stroke="url(#woodGrad2)" stroke-width="22" fill="none" stroke-linecap="round"/>

                <!-- 木质纹理线 -->
                <path d="M100,386 Q150,380 200,384 Q260,388 320,382 Q360,380 390,386" 
                      stroke="rgba(40,25,15,0.3)" stroke-width="1.5" fill="none"/>

                <!-- 左端分叉枝丫 -->

                <path d="M420,388 Q435,385 450,392" stroke="#1a0e08" stroke-width="6" fill="none" stroke-linecap="round"/>
                <path d="M435,375 Q445,362 455,358" stroke="#1a0e08" stroke-width="5" fill="none" stroke-linecap="round"/>
                <path d="M450,368 Q460,365 468,368" stroke="#1a0e08" stroke-width="4" fill="none" stroke-linecap="round"/>

                <ellipse cx="250" cy="384" rx="9" ry="6" fill="#0d0805" stroke="#2a1a10" stroke-width="1"/>

        <!-- ===== 交互区 ===== -->
        <div class="interact-area">
            <div class="input-wrapper">
                <input type="text" id="wish-input" placeholder="在此写下你渴望的..." maxlength="200">

            <div class="btn-row">
                <button id="submit-btn">掰断它</button>
            </div>
            <div class="loading-text" id="loading-text">✦ 许下愿望，掰断因果 ✦</div>

        <!-- ===== 代价契约展示区 ===== -->
        <div class="contract-area" id="contract-area">
            <div class="contract-col">
                <div class="label">【许愿原文】</div>
                <div class="content wish-text" id="wish-display"></div>
            </div>
            <div class="contract-col">
                <div class="label">【扭曲的代价】</div>
                <div class="content price-text" id="price-display"></div>
            </div>
            <div class="contract-footer">✦ 愿望已兑现，代价已刻入因果 ✦</div>
        </div>

    </div>

    <script>
        // ============================================================
        //  JS 交互逻辑（与之前保持一致，仅微调样式类）
        // ============================================================

        const willow = document.getElementById('willow-svg');
        const submitBtn = document.getElementById('submit-btn');
        const wishInput = document.getElementById('wish-input');
        const loadingText = document.getElementById('loading-text');
        const contractArea = document.getElementById('contract-area');
        const wishDisplay = document.getElementById('wish-display');
        const priceDisplay = document.getElementById('price-display');

        // 折断动画（无粒子特效，改为SVG枝条断裂感）
        function playBreakAnimation() {
            return new Promise((resolve) => {
                willow.classList.remove('sway');
                willow.classList.add('shake');
                // 模拟枝条断裂：改变杆身颜色和透明度
                const paths = willow.querySelectorAll('path');
                paths.forEach((p, i) => {
                    if (i % 2 === 0) {
                        p.style.transition = 'stroke 0.3s, opacity 0.5s';
                        p.style.stroke = '#4a2a1a';
                        if (i > 5) {
                            p.style.opacity = '0.3';
                        }
                    }
                });
                setTimeout(() => {
                    willow.classList.remove('shake');
                    willow.classList.add('sway');
                    // 恢复
                    paths.forEach((p) => {
                        p.style.transition = 'stroke 0.8s, opacity 0.8s';
                        p.style.stroke = '';
                        p.style.opacity = '';
                    });
                    resolve();
                }, 1200);
            });
        }

        async function handleMakeWish() {
            const wish = wishInput.value.trim();
            if (!wish) {
                loadingText.textContent = '✧ 请先写下你的愿望... ✧';
                loadingText.classList.add('active');
                return;
            }

            submitBtn.disabled = true;
            loadingText.textContent = '✦ 交易正在缔结... ✦';
            loadingText.classList.add('active');
            contractArea.classList.remove('show');

            // 播放折断动画
            await playBreakAnimation();

            try {
                const response = await fetch('/api/make-wish', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ wish: wish })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`API错误 (${response.status}): ${errText}`);
                }

                const data = await response.json();
                if (!data.wish || !data.price) {
                    throw new Error('返回数据格式异常');
                }

                wishDisplay.textContent = data.wish;
                priceDisplay.textContent = '';
                contractArea.classList.add('show');

                // 打字机效果
                const text = data.price;
                let index = 0;
                const typeInterval = setInterval(() => {
                    if (index < text.length) {
                        priceDisplay.textContent += text.charAt(index);
                        index++;
                        contractArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    } else {
                        clearInterval(typeInterval);
                        loadingText.textContent = '✦ 契约已立 ✦';
                        loadingText.classList.remove('active');
                        submitBtn.disabled = false;
                    }
                }, 30);

            } catch (error) {
                console.error('请求失败:', error);
                loadingText.textContent = '✧ 因果中断，请重试 ✧';
                loadingText.classList.remove('active');
                submitBtn.disabled = false;
                contractArea.classList.remove('show');
            }
        }

        submitBtn.addEventListener('click', handleMakeWish);
        wishInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleMakeWish();
            }
        });

        loadingText.textContent = '✦ 许下愿望，掰断因果 ✦';
        loadingText.classList.remove('active');
    </script>

</body>
</html>
